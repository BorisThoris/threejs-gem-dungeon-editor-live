name: Verify game

on:
  push:
  pull_request:

jobs:
  verify:
    # Self-hosted (owner's decision, 2026-10-13): GitHub-hosted jobs are refused while the
    # account's Actions billing is suspended, so Linux jobs run on the owner's own ARM64 boxes
    # (the Kinhank and the tablet, Debian in proot, one runner per repo on each).
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install source-check tools
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update && $SUDO apt-get install -y ripgrep
      - run: yarn install --frozen-lockfile
      - run: npx playwright-core install --with-deps chromium
      - run: yarn verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report
          path: |
            output/verification/short.json
            output/verification/short-logs/
          if-no-files-found: warn
          retention-days: 14
  systems:
    # Self-hosted (owner's decision, 2026-10-13): GitHub-hosted jobs are refused while the
    # account's Actions billing is suspended, so Linux jobs run on the owner's own ARM64 boxes
    # (the Kinhank and the tablet, Debian in proot, one runner per repo on each).
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx playwright-core install --with-deps chromium
      - run: yarn verify:systems
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: systems-verification-report
          path: |
            output/verification/systems.json
            output/verification/systems-logs/
          if-no-files-found: warn
          retention-days: 14
