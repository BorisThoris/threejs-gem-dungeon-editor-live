name: Verify game

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx playwright-core install --with-deps chromium
      - run: yarn verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report
          path: |
            output/verification/short.json
            output/verification/short-logs/
          if-no-files-found: warn
          retention-days: 14
  systems:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx playwright-core install --with-deps chromium
      - run: yarn verify:systems
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: systems-verification-report
          path: |
            output/verification/systems.json
            output/verification/systems-logs/
          if-no-files-found: warn
          retention-days: 14
